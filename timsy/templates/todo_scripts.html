<script type="text/javascript">
(function () {
    var draggedId = null;
    var dialog = document.getElementById("todo-add-dialog");
    if (!dialog) {
        return;
    }
    var addForm = dialog.querySelector("form");
    var heading = document.getElementById("todo-add-heading");

    document.querySelectorAll("[data-todo-handle]").forEach(function (handle) {
        handle.addEventListener("dragstart", function (e) {
            draggedId = this.getAttribute("data-todo-id");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", draggedId);
        });
        handle.addEventListener("dragend", function () {
            draggedId = null;
        });
    });

    document.querySelectorAll("[data-todo-column]").forEach(function (column) {
        column.addEventListener("dragover", function (e) {
            e.preventDefault();
        });
        column.addEventListener("drop", function (e) {
            e.preventDefault();
            var itemId = draggedId || e.dataTransfer.getData("text/plain");
            if (!itemId) {
                return;
            }
            var overItem = e.target.closest("[data-todo-item]");
            var beforeId = "";
            if (overItem) {
                beforeId = overItem.getAttribute("data-todo-id") || "";
                if (beforeId === itemId) {
                    beforeId = "";
                }
            }
            var form = document.getElementById("todo-move-form");
            form.item_id.value = itemId;
            form.horizon.value = this.getAttribute("data-horizon");
            form.horizon_date.value = this.getAttribute("data-horizon-date");
            form.before_id.value = beforeId;
            form.submit();
        });
    });
    document.querySelectorAll("[data-todo-add]").forEach(function (button) {
        button.addEventListener("click", function () {
            addForm.horizon.value = this.getAttribute("data-horizon");
            addForm.horizon_date.value = this.getAttribute("data-horizon-date");
            addForm.parent.value = "";
            addForm.description.value = "";
            addForm.activity.value = "";
            addForm.note.value = "";
            heading.textContent = "Add — " + this.getAttribute("data-title");
            dialog.showModal();
        });
    });

    document.getElementById("todo-add-cancel").addEventListener("click", function () {
        dialog.close();
    });

    dialog.addEventListener("click", function (e) {
        if (e.target === dialog) {
            dialog.close();
        }
    });

    var activitiesByParent = {{ activities_by_parent_json|safe }};
    document.querySelectorAll("[data-activity-filter]").forEach(function (parentSelect) {
        var row = parentSelect.closest("[data-todo-item]");
        var activitySelect = row ? row.querySelector("select[name=activity]") : null;
        if (!activitySelect && parentSelect.form) {
            activitySelect = parentSelect.form.querySelector("select[name=activity]");
        }
        if (!activitySelect) {
            return;
        }
        parentSelect.addEventListener("change", function () {
            var kept = activitySelect.value;
            var options = activitiesByParent[parentSelect.value] || [];
            activitySelect.innerHTML = "";
            var none = document.createElement("option");
            none.value = "";
            none.textContent = "(none)";
            activitySelect.appendChild(none);
            var found = false;
            options.forEach(function (opt) {
                var option = document.createElement("option");
                option.value = opt[0];
                option.textContent = opt[1];
                if (String(opt[0]) === kept) {
                    option.selected = true;
                    found = true;
                }
                activitySelect.appendChild(option);
            });
            if (!found) {
                activitySelect.value = "";
            }
        });
    });
})();
</script>
